name: ECS Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag override
        required: false
        type: string
      deploy_mode:
        description: Deployment mode
        required: true
        default: preserve
        type: choice
        options:
          - preserve
          - activate
      service_selection:
        description: Services to deploy
        required: true
        default: auto
        type: choice
        options:
          - auto
          - all
          - custom
      deploy_frontend:
        description: Include frontend when service_selection=custom
        required: false
        default: false
        type: boolean
      deploy_backend:
        description: Include backend when service_selection=custom
        required: false
        default: false
        type: boolean
      deploy_ai:
        description: Include ai when service_selection=custom
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: ecs-prod-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '819044292803' }}
  ECS_CLUSTER: kt10-prod
  PROD_BASE_URL: ${{ vars.PROD_BASE_URL || 'https://dongnet.kr' }}

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout deploy source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Resolve deployment plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_MODE_INPUT: ${{ github.event.inputs.deploy_mode || '' }}
          SERVICE_SELECTION_INPUT: ${{ github.event.inputs.service_selection || '' }}
          DEPLOY_FRONTEND_INPUT: ${{ github.event.inputs.deploy_frontend || 'false' }}
          DEPLOY_BACKEND_INPUT: ${{ github.event.inputs.deploy_backend || 'false' }}
          DEPLOY_AI_INPUT: ${{ github.event.inputs.deploy_ai || 'false' }}
        run: |
          set -euo pipefail

          bool_input() {
            case "${1,,}" in
              true|1|yes|on) echo "true" ;;
              *) echo "false" ;;
            esac
          }

          deploy_mode="preserve"
          service_selection="auto"
          deploy_frontend="false"
          deploy_backend="false"
          deploy_ai="false"
          changed_files=""
          changed_files_status="not-needed"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            deploy_mode="${DEPLOY_MODE_INPUT:-preserve}"
            service_selection="${SERVICE_SELECTION_INPUT:-auto}"
          fi

          case "$deploy_mode" in
            preserve|activate) ;;
            *)
              echo "Invalid deploy_mode: $deploy_mode" >&2
              exit 1
              ;;
          esac
          case "$service_selection" in
            auto|all|custom) ;;
            *)
              echo "Invalid service_selection: $service_selection" >&2
              exit 1
              ;;
          esac

          if [ "$service_selection" = "all" ]; then
            deploy_frontend="true"
            deploy_backend="true"
            deploy_ai="true"
          elif [ "$service_selection" = "custom" ]; then
            deploy_frontend="$(bool_input "$DEPLOY_FRONTEND_INPUT")"
            deploy_backend="$(bool_input "$DEPLOY_BACKEND_INPUT")"
            deploy_ai="$(bool_input "$DEPLOY_AI_INPUT")"
            if [ "$deploy_frontend" != "true" ] \
              && [ "$deploy_backend" != "true" ] \
              && [ "$deploy_ai" != "true" ]; then
              echo "service_selection=custom requires at least one service." >&2
              exit 1
            fi
          else
            if base_sha="$(git rev-parse "${SOURCE_SHA}^1" 2>/dev/null)"; then
              changed_files="$(git diff --name-only "$base_sha" "$SOURCE_SHA" --)"
              changed_files_status="resolved"
            else
              echo "Could not resolve base SHA for $SOURCE_SHA; deploying all services." >&2
              changed_files_status="fallback-all"
              deploy_frontend="true"
              deploy_backend="true"
              deploy_ai="true"
            fi

            if [ "$changed_files_status" = "resolved" ]; then
              if [ -z "$changed_files" ]; then
                changed_files_status="no-changes"
              fi
              while IFS= read -r file; do
                [ -n "$file" ] || continue
                case "$file" in
                  *.md|*.txt)
                    ;;
                  docker-compose.prod.yml|.env.production.example|scripts/prepare_deployment_env.py|.github/workflows/deploy-ecs.yml|data/*|data/**)
                    deploy_frontend="true"
                    deploy_backend="true"
                    deploy_ai="true"
                    ;;
                  frontend/*|frontend/**)
                    deploy_frontend="true"
                    ;;
                  backend/*|backend/**)
                    deploy_backend="true"
                    ;;
                  ai/*|ai/**)
                    deploy_ai="true"
                    ;;
                  *)
                    echo "Treating shared or unknown change as full deploy: $file"
                    deploy_frontend="true"
                    deploy_backend="true"
                    deploy_ai="true"
                    ;;
                esac
              done <<< "$changed_files"
            fi
          fi

          deploy_any="false"
          selected_services=""
          if [ "$deploy_frontend" = "true" ]; then
            deploy_any="true"
            selected_services="${selected_services} kt10-frontend"
          fi
          if [ "$deploy_backend" = "true" ]; then
            deploy_any="true"
            selected_services="${selected_services} kt10-backend"
          fi
          if [ "$deploy_ai" = "true" ]; then
            deploy_any="true"
            selected_services="${selected_services} kt10-ai"
          fi
          selected_services="${selected_services# }"

          {
            echo "deploy_mode=$deploy_mode"
            echo "service_selection=$service_selection"
            echo "deploy_frontend=$deploy_frontend"
            echo "deploy_backend=$deploy_backend"
            echo "deploy_ai=$deploy_ai"
            echo "deploy_any=$deploy_any"
            echo "selected_services=$selected_services"
            echo "changed_files_status=$changed_files_status"
            echo "changed_files<<EOF"
            echo "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Deployment mode: $deploy_mode"
          echo "Service selection: $service_selection"
          echo "Changed files status: $changed_files_status"
          echo "Deploy frontend: $deploy_frontend"
          echo "Deploy backend: $deploy_backend"
          echo "Deploy ai: $deploy_ai"
          if [ "$deploy_any" = "true" ]; then
            echo "Selected services: $selected_services"
          else
            echo "No deployable service changes detected."
          fi

      - name: Skip deployment
        if: ${{ steps.plan.outputs.deploy_any != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "No ECS deployment target was selected."
          echo "Changed files status: ${{ steps.plan.outputs.changed_files_status }}"

      - name: Configure AWS credentials
        if: ${{ steps.plan.outputs.deploy_any == 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        if: ${{ steps.plan.outputs.deploy_any == 'true' }}
        id: image
        shell: bash
        env:
          IMAGE_TAG_INPUT: ${{ github.event.inputs.image_tag || '' }}
        run: |
          set -euo pipefail
          source_sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          if [ -n "$IMAGE_TAG_INPUT" ]; then
            image_tag="$IMAGE_TAG_INPUT"
          else
            image_tag="${source_sha:0:7}-${GITHUB_RUN_NUMBER}"
          fi
          if ! [[ "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $image_tag" >&2
            exit 1
          fi
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          {
            echo "tag=${image_tag}"
            echo "registry=${registry}"
          } >> "$GITHUB_OUTPUT"

      - name: Inspect AI network registration target
        if: ${{ steps.plan.outputs.deploy_ai == 'true' }}
        shell: bash
        run: |
          set +e
          network_configuration="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services kt10-ai \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json)"
          echo "AI service network configuration: $network_configuration"
          task_arn="$(aws ecs list-tasks \
            --cluster "$ECS_CLUSTER" \
            --service-name kt10-ai \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)"
          if [ -n "$task_arn" ] && [ "$task_arn" != "None" ]; then
            eni_id="$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$task_arn" \
              --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value | [0]' \
              --output text)"
            if [ -n "$eni_id" ] && [ "$eni_id" != "None" ]; then
              aws ec2 describe-network-interfaces \
                --network-interface-ids "$eni_id" \
                --query 'NetworkInterfaces[0].{networkInterfaceId:NetworkInterfaceId,subnetId:SubnetId,privateIp:PrivateIpAddress,publicIp:Association.PublicIp}' \
                --output json || true
            fi
          fi
          exit 0

      - name: Login to ECR
        if: ${{ steps.plan.outputs.deploy_any == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "${{ steps.image.outputs.registry }}"

      - name: Build frontend image
        if: ${{ steps.plan.outputs.deploy_frontend == 'true' }}
        shell: bash
        env:
          KAKAO_BROWSER_APP_ID: ${{ secrets.VITE_KAKAO_MAP_KEY }}
        run: |
          set -euo pipefail
          docker build \
            -f frontend/Dockerfile.prod \
            --build-arg KAKAO_BROWSER_APP_ID="$KAKAO_BROWSER_APP_ID" \
            --build-arg VITE_DATA_SOURCE=live \
            --build-arg VITE_API_BASE= \
            -t "${{ steps.image.outputs.registry }}/kt10-frontend:${{ steps.image.outputs.tag }}" \
            .

      - name: Build backend image
        if: ${{ steps.plan.outputs.deploy_backend == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f backend/Dockerfile \
            -t "${{ steps.image.outputs.registry }}/kt10-backend:${{ steps.image.outputs.tag }}" \
            .

      - name: Build AI image
        if: ${{ steps.plan.outputs.deploy_ai == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f ai/Dockerfile \
            -t "${{ steps.image.outputs.registry }}/kt10-ai:${{ steps.image.outputs.tag }}" \
            .

      - name: Push frontend image
        if: ${{ steps.plan.outputs.deploy_frontend == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.image.outputs.registry }}/kt10-frontend:${{ steps.image.outputs.tag }}"

      - name: Push backend image
        if: ${{ steps.plan.outputs.deploy_backend == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.image.outputs.registry }}/kt10-backend:${{ steps.image.outputs.tag }}"

      - name: Push AI image
        if: ${{ steps.plan.outputs.deploy_ai == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.image.outputs.registry }}/kt10-ai:${{ steps.image.outputs.tag }}"

      - name: Register selected task definitions
        id: taskdefs
        if: ${{ steps.plan.outputs.deploy_any == 'true' }}
        shell: bash
        env:
          AI_INTERNAL_SERVICE_TOKEN: ${{ secrets.AI_INTERNAL_SERVICE_TOKEN }}
          ODSAY_API_KEY: ${{ secrets.ODSAY_API_KEY }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
          NVIDIA_API_KEY_SECRET_ARN: ${{ vars.NVIDIA_API_KEY_SECRET_ARN || 'arn:aws:secretsmanager:ap-northeast-2:819044292803:secret:kt10/prod/nvidia-api-key-0h39Xl' }}
          NIM_BASE_URL: ${{ vars.NIM_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
          NIM_MODEL: ${{ vars.NIM_MODEL || 'nvidia/nvidia-nemotron-nano-9b-v2' }}
          DEPLOY_FRONTEND: ${{ steps.plan.outputs.deploy_frontend }}
          DEPLOY_BACKEND: ${{ steps.plan.outputs.deploy_backend }}
          DEPLOY_AI: ${{ steps.plan.outputs.deploy_ai }}
        run: |
          set -euo pipefail
          tag="${{ steps.image.outputs.tag }}"
          registry="${{ steps.image.outputs.registry }}"
          if { [ "$DEPLOY_BACKEND" = "true" ] || [ "$DEPLOY_AI" = "true" ]; } \
            && [ "${#AI_INTERNAL_SERVICE_TOKEN}" -lt 32 ]; then
            echo "AI_INTERNAL_SERVICE_TOKEN secret must be at least 32 characters." >&2
            exit 1
          fi
          if [ "$DEPLOY_AI" = "true" ] && [ -z "$ORS_API_KEY" ]; then
            echo "ORS_API_KEY secret is required for wheelchair routing." >&2
            exit 1
          fi
          if [ "$DEPLOY_AI" = "true" ] && [ -z "$ODSAY_API_KEY" ]; then
            echo "ODSAY_API_KEY secret is required for transit routing." >&2
            exit 1
          fi
          if [ "$DEPLOY_BACKEND" = "true" ]; then
            if [ -z "$NVIDIA_API_KEY_SECRET_ARN" ]; then
              echo "NVIDIA_API_KEY_SECRET_ARN variable is required for NIM route explanations." >&2
              exit 1
            fi
            if [ -z "$NIM_MODEL" ]; then
              echo "NIM_MODEL variable is required for NIM route explanations." >&2
              exit 1
            fi
          fi
          if [ "$DEPLOY_AI" = "true" ]; then
            python - <<'PY'
          import hashlib
          import os

          key = os.environ["ODSAY_API_KEY"]
          fingerprint = hashlib.sha256(key.encode("utf-8")).hexdigest()[:12]
          print(
              "ODsay credential validation "
              f"length={len(key)} fingerprint={fingerprint}"
          )
          PY
          fi
          snapshot_desired_count() {
            local service="$1"
            local output_key="$2"
            desired_count="$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$service" \
              --query 'services[0].desiredCount' \
              --output text)"
            if ! [[ "$desired_count" =~ ^[0-9]+$ ]]; then
              echo "Invalid desired count for $service: $desired_count" >&2
              exit 1
            fi
            echo "$output_key=$desired_count" >> "$GITHUB_OUTPUT"
          }

          register_task_definition() {
            local family="$1"
            local container="$2"
            local image="$3"
            local output_key="$4"
            local inject_internal_token="$5"
            local inject_ors_key="$6"
            local inject_odsay_key="$7"
            local inject_nvidia_nim="$8"

            aws ecs describe-task-definition \
              --task-definition "$family" \
              --query taskDefinition \
              > "$family.current.json"

            jq \
              --arg container "$container" \
              --arg image "$image" \
              --arg internal_token "$AI_INTERNAL_SERVICE_TOKEN" \
              --arg ors_api_key "$ORS_API_KEY" \
              --arg odsay_api_key "$ODSAY_API_KEY" \
              --arg nvidia_api_key_secret_arn "$NVIDIA_API_KEY_SECRET_ARN" \
              --arg nim_base_url "$NIM_BASE_URL" \
              --arg nim_model "$NIM_MODEL" \
              --argjson inject_internal_token "$inject_internal_token" \
              --argjson inject_ors_key "$inject_ors_key" \
              --argjson inject_odsay_key "$inject_odsay_key" \
              --argjson inject_nvidia_nim "$inject_nvidia_nim" \
              'del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
              | .containerDefinitions |= map(
                if .name == $container then
                  .image = $image
                  | if $inject_internal_token then
                      .environment = (
                        (.environment // [])
                        | map(select(.name != "AI_INTERNAL_SERVICE_TOKEN"))
                        + [{
                            name: "AI_INTERNAL_SERVICE_TOKEN",
                            value: $internal_token
                          }]
                      )
                    else .
                    end
                  | if $inject_ors_key then
                      .environment = (
                        (.environment // [])
                        | map(select(.name != "ORS_API_KEY"))
                        + [{
                            name: "ORS_API_KEY",
                            value: $ors_api_key
                          }]
                      )
                    else .
                    end
                  | if $inject_odsay_key then
                      .secrets = ((.secrets // []) | map(select(.name != "ODSAY_API_KEY")))
                      | .environment = (
                        (.environment // [])
                        | map(select(.name != "ODSAY_API_KEY"))
                        + [{
                            name: "ODSAY_API_KEY",
                            value: $odsay_api_key
                          }]
                      )
                    else .
                    end
                  | if $inject_nvidia_nim then
                      .secrets = (
                        (.secrets // [])
                        | map(select(.name != "NVIDIA_API_KEY"))
                        + [{
                            name: "NVIDIA_API_KEY",
                            valueFrom: $nvidia_api_key_secret_arn
                          }]
                      )
                      | .environment = (
                        (.environment // [])
                        | map(
                            select(
                              .name != "NVIDIA_API_KEY"
                              and .name != "NIM_BASE_URL"
                              and .name != "NIM_MODEL"
                            )
                          )
                        + [
                          {
                            name: "NIM_BASE_URL",
                            value: $nim_base_url
                          },
                          {
                            name: "NIM_MODEL",
                            value: $nim_model
                          }
                        ]
                      )
                    else .
                    end
                else .
                end
              )' \
              "$family.current.json" > "$family.next.json"

            previous_arn="$(jq -r '.taskDefinitionArn' "$family.current.json")"
            arn="$(aws ecs register-task-definition \
              --cli-input-json "file://$family.next.json" \
              --query taskDefinition.taskDefinitionArn \
              --output text)"
            echo "$output_key=$arn" >> "$GITHUB_OUTPUT"
            echo "${output_key}_previous=$previous_arn" >> "$GITHUB_OUTPUT"
          }

          snapshot_desired_count kt10-ai ai_previous_desired_count
          snapshot_desired_count kt10-backend backend_previous_desired_count
          snapshot_desired_count kt10-frontend frontend_previous_desired_count

          if [ "$DEPLOY_AI" = "true" ]; then
            register_task_definition \
              kt10-ai-task \
              ai \
              "$registry/kt10-ai:$tag" \
              ai_task_definition \
              true \
              true \
              true \
              false
          fi
          if [ "$DEPLOY_BACKEND" = "true" ]; then
            register_task_definition \
              kt10-backend-task \
              backend \
              "$registry/kt10-backend:$tag" \
              backend_task_definition \
              true \
              false \
              false \
              true
          fi
          if [ "$DEPLOY_FRONTEND" = "true" ]; then
            register_task_definition \
              kt10-frontend-task \
              frontend \
              "$registry/kt10-frontend:$tag" \
              frontend_task_definition \
              false \
              false \
              false \
              false
          fi

      - name: Deploy AI
        if: ${{ steps.plan.outputs.deploy_ai == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          desired="${{ steps.taskdefs.outputs.ai_previous_desired_count }}"
          if [ "${{ steps.plan.outputs.deploy_mode }}" = "activate" ]; then
            desired="1"
          fi
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service kt10-ai \
            --task-definition "${{ steps.taskdefs.outputs.ai_task_definition }}" \
            --desired-count "$desired" \
            --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=200,minimumHealthyPercent=100" \
            >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services kt10-ai
          read -r actual actual_desired running < <(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services kt10-ai \
            --query 'services[0].[taskDefinition,desiredCount,runningCount]' \
            --output text)
          test "$actual" = "${{ steps.taskdefs.outputs.ai_task_definition }}"
          test "$actual_desired" = "$desired"
          test "$running" = "$desired"

      - name: Deploy backend
        if: ${{ steps.plan.outputs.deploy_backend == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          desired="${{ steps.taskdefs.outputs.backend_previous_desired_count }}"
          if [ "${{ steps.plan.outputs.deploy_mode }}" = "activate" ]; then
            desired="1"
          fi
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service kt10-backend \
            --task-definition "${{ steps.taskdefs.outputs.backend_task_definition }}" \
            --desired-count "$desired" \
            --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=200,minimumHealthyPercent=100" \
            >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services kt10-backend
          read -r actual actual_desired running < <(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services kt10-backend \
            --query 'services[0].[taskDefinition,desiredCount,runningCount]' \
            --output text)
          test "$actual" = "${{ steps.taskdefs.outputs.backend_task_definition }}"
          test "$actual_desired" = "$desired"
          test "$running" = "$desired"

      - name: Deploy frontend
        if: ${{ steps.plan.outputs.deploy_frontend == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          desired="${{ steps.taskdefs.outputs.frontend_previous_desired_count }}"
          if [ "${{ steps.plan.outputs.deploy_mode }}" = "activate" ]; then
            desired="1"
          fi
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service kt10-frontend \
            --task-definition "${{ steps.taskdefs.outputs.frontend_task_definition }}" \
            --desired-count "$desired" \
            --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true},maximumPercent=200,minimumHealthyPercent=100" \
            >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services kt10-frontend
          read -r actual actual_desired running < <(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services kt10-frontend \
            --query 'services[0].[taskDefinition,desiredCount,runningCount]' \
            --output text)
          test "$actual" = "${{ steps.taskdefs.outputs.frontend_task_definition }}"
          test "$actual_desired" = "$desired"
          test "$running" = "$desired"

      - name: Evaluate smoke test eligibility
        id: smoke
        if: ${{ steps.plan.outputs.deploy_any == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          counts="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services kt10-ai kt10-backend kt10-frontend \
            --query 'services[].{service:serviceName,desired:desiredCount,running:runningCount}' \
            --output json)"
          echo "$counts" | jq -c .
          ready="$(jq -r '
            length == 3 and all(.[]; (.desired >= 1 and .running >= 1))
          ' <<<"$counts")"
          if [ "$ready" = "true" ]; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
            echo "All ECS services are running; production smoke test will run."
          else
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
            echo "Production smoke test skipped because the full ECS stack is not running."
          fi

      - name: Smoke test ALB core route service
        if: ${{ steps.smoke.outputs.run_smoke == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$PROD_BASE_URL/healthz" >/dev/null \
              && curl --fail --silent --show-error "$PROD_BASE_URL/api/health" >/dev/null \
              && readiness="$(
                curl --fail --silent --show-error "$PROD_BASE_URL/api/readiness"
              )" \
              && jq -e '
                . as $readiness
                | [
                    "live_route_candidates",
                    "live_building_shade",
                    "kakao_place_search",
                    "live_weather",
                    "live_bus_arrivals",
                    "postgresql",
                    "session_signing",
                    "personalization_policy",
                    "labeling_batch_auth",
                    "ai_internal_service_auth"
                  ]
                | all(.[]; $readiness.checks[.] == true)
              ' <<<"$readiness" >/dev/null; then
              jq -c '{ready, missing}' <<<"$readiness"
              echo "Production smoke test passed on attempt $attempt."
              exit 0
            fi
            echo "Production is not ready yet (attempt $attempt/30)." >&2
            sleep 10
          done
          echo "Production smoke test did not become ready within 5 minutes." >&2
          exit 1

      - name: Collect safe ECS diagnostics after failure
        if: ${{ failure() && steps.plan.outputs.deploy_any == 'true' }}
        shell: bash
        env:
          SELECTED_SERVICES: ${{ steps.plan.outputs.selected_services }}
        run: |
          set +e
          for service in $SELECTED_SERVICES; do
            echo "::group::$service service state"
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$service" \
              --query 'services[0].{status:status,desired:desiredCount,running:runningCount,pending:pendingCount,taskDefinition:taskDefinition,loadBalancers:loadBalancers,deployments:deployments[*].{status:status,rolloutState:rolloutState,rolloutStateReason:rolloutStateReason,taskDefinition:taskDefinition,running:runningCount,pending:pendingCount,failed:failedTasks},events:events[:10].message}' \
              --output json
            echo "::endgroup::"
          done

      - name: Roll back selected services after failed deployment
        if: ${{ failure() && steps.taskdefs.outcome == 'success' }}
        shell: bash
        env:
          DEPLOY_FRONTEND: ${{ steps.plan.outputs.deploy_frontend }}
          DEPLOY_BACKEND: ${{ steps.plan.outputs.deploy_backend }}
          DEPLOY_AI: ${{ steps.plan.outputs.deploy_ai }}
        run: |
          set -euo pipefail
          rollback_service() {
            local service="$1"
            local previous_task_definition="$2"
            local previous_desired_count="$3"
            if [ -z "$previous_task_definition" ]; then
              echo "Missing previous task definition for $service." >&2
              return 1
            fi
            if ! [[ "$previous_desired_count" =~ ^[0-9]+$ ]]; then
              echo "Invalid previous desired count for $service." >&2
              return 1
            fi
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$service" \
              --task-definition "$previous_task_definition" \
              --desired-count "$previous_desired_count" \
              >/dev/null
          }

          wait_services=()
          if [ "$DEPLOY_AI" = "true" ]; then
            rollback_service \
              kt10-ai \
              "${{ steps.taskdefs.outputs.ai_task_definition_previous }}" \
              "${{ steps.taskdefs.outputs.ai_previous_desired_count }}"
            wait_services+=(kt10-ai)
          fi
          if [ "$DEPLOY_BACKEND" = "true" ]; then
            rollback_service \
              kt10-backend \
              "${{ steps.taskdefs.outputs.backend_task_definition_previous }}" \
              "${{ steps.taskdefs.outputs.backend_previous_desired_count }}"
            wait_services+=(kt10-backend)
          fi
          if [ "$DEPLOY_FRONTEND" = "true" ]; then
            rollback_service \
              kt10-frontend \
              "${{ steps.taskdefs.outputs.frontend_task_definition_previous }}" \
              "${{ steps.taskdefs.outputs.frontend_previous_desired_count }}"
            wait_services+=(kt10-frontend)
          fi
          if [ "${#wait_services[@]}" -gt 0 ]; then
            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "${wait_services[@]}"
          fi
