name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: pip install -r ai/requirements.txt
      - run: python -m pytest ai/tests -q
        env:
          PYTHONPATH: ai
      - run: python -m compileall -q ai
      - run: pip check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kt10_test
          POSTGRES_USER: kt10
          POSTGRES_PASSWORD: kt10-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kt10 -d kt10_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://kt10:kt10-ci-only@localhost:5432/kt10_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
      - run: python -m compileall -q backend
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      - run: pip check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --audit-level=moderate

  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate UTF-8 and JSON contracts
        shell: python
        run: |
          import json
          from pathlib import Path

          roots = [Path("ai"), Path("backend"), Path("data"), Path("docs"), Path("frontend/src")]
          suffixes = {".py", ".md", ".json", ".jsonl", ".ts", ".tsx", ".css", ".yml", ".yaml"}
          for root in roots:
              for path in root.rglob("*"):
                  if path.is_file() and path.suffix.lower() in suffixes:
                      path.read_text(encoding="utf-8")
          for path in Path("data").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          for path in Path("data").rglob("*.jsonl"):
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if line.strip():
                      json.loads(line)

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare keyless build configuration
        run: |
          cp ai/.env.example ai/.env
          cp backend/.env.example backend/.env
          cp frontend/.env.example frontend/.env
      - run: docker compose config --quiet
      - run: docker compose build
