name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai/requirements.txt
            ai/requirements-dev.txt
      - run: pip install -r ai/requirements-dev.txt
      - run: python -m pytest ai/tests -q
        env:
          PYTHONPATH: ai
      - run: python -m compileall -q ai
      - run: python -m ruff check ai --select E4,E7,E9,F
      - run: python -m bandit -q -ll -r ai -x ai/tests
      - run: python -m pip_audit -r ai/requirements.txt --progress-spinner off
      - run: pip check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kt10_test
          POSTGRES_USER: kt10
          POSTGRES_PASSWORD: kt10-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kt10 -d kt10_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://kt10:kt10-ci-only@localhost:5432/kt10_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
      - run: python -m compileall -q backend
      - run: python -m ruff check backend scripts --select E4,E7,E9,F
      - run: python -m bandit -q -ll -r backend/app backend/ml
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      - run: python -m pip_audit -r backend/requirements.txt --progress-spinner off
      - run: pip check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:a11y
      - run: npm audit --audit-level=moderate

  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate UTF-8 and JSON contracts
        shell: python
        run: |
          import json
          from pathlib import Path

          roots = [
              Path(".github"), Path("ai"), Path("backend"), Path("data"),
              Path("docs"), Path("frontend"), Path("scripts"),
          ]
          suffixes = {
              ".py", ".md", ".json", ".jsonl", ".ts", ".tsx", ".css",
              ".html", ".conf", ".svg", ".yml", ".yaml",
          }
          for root in roots:
              for path in root.rglob("*"):
                  if path.is_file() and path.suffix.lower() in suffixes:
                      path.read_text(encoding="utf-8")
          for path in Path("data").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          for path in Path("data").rglob("*.jsonl"):
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if line.strip():
                      json.loads(line)
          for path in (Path("README.md"), Path("docker-compose.yml"), Path("docker-compose.prod.yml")):
              path.read_text(encoding="utf-8")

  docker-build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_ORIGIN: https://route-ci.example.invalid
      BIND_ADDRESS: 127.0.0.1
      PORT: "8080"
      ROUTE_MODE: live
      BUILDING_SOURCE: vworld
      RANKER_TIER: human_validated
      OSMNX_WALK_GEOMETRY_ENABLED: "false"
      REQUEST_TIMEOUT: "8"
      POSTGRES_PASSWORD: ci-postgres-password
      SESSION_SECRET: ci-session-secret-at-least-32-characters
      TRAINING_ANONYMIZATION_SALT: ci-training-salt-at-least-32-characters
      LABELING_API_TOKEN: ci-labeling-token-at-least-32-characters
      AI_INTERNAL_SERVICE_TOKEN: ci-internal-service-token-at-least-32-characters
      WITHDRAWAL_HASH_SALT: ci-withdrawal-hash-salt-at-least-16-characters
      VITE_KAKAO_MAP_KEY: ci-kakao-js-key
      KAKAO_REST_API_KEY: ci-kakao-rest-key
      KAKAO_OAUTH_CLIENT_SECRET: ci-kakao-oauth-secret
      ODSAY_API_KEY: ci-odsay-key
      TMAP_API_KEY: ci-tmap-key
      VWORLD_API_KEY: ci-vworld-key
      OPENWEATHER_API_KEY: ci-openweather-key
      BUS_SERVICE_KEY: ci-bus-service-key
    steps:
      - uses: actions/checkout@v7
      - name: Validate production environment
        run: |
          python - <<'PY'
          import os
          from scripts.prepare_deployment_env import (
              EXAMPLE,
              TARGET,
              _render,
              _values,
              check,
          )

          values = _values(EXAMPLE)
          values.update({
              key: os.environ[key]
              for key in values
              if os.environ.get(key)
          })
          TARGET.write_text(
              _render(EXAMPLE.read_text(encoding="utf-8"), values),
              encoding="utf-8",
          )
          check()
          PY
      - name: Validate production compose
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet
      - name: Build production images
        run: docker compose --env-file .env.production -f docker-compose.prod.yml build
      - name: Verify hardened production runtime
        run: |
          set -euo pipefail
          dc() {
            docker compose --env-file .env.production -f docker-compose.prod.yml "$@"
          }
          trap 'dc down -v' EXIT
          dc up -d --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error http://127.0.0.1:8080/api/readiness |
            python -c 'import json,sys; data=json.load(sys.stdin); assert data["ready"] is True'
          if curl --silent --head http://127.0.0.1:8080/ |
            grep --ignore-case --quiet '^strict-transport-security:'; then
            echo "HSTS must not be asserted over direct HTTP" >&2
            exit 1
          fi
          for service in ai backend frontend; do
            dc exec -T "$service" sh -c 'test "$(id -u)" -ne 0'
            dc exec -T "$service" sh -c \
              'grep -Eq "^CapEff:[[:space:]]+0+$" /proc/1/status'
            dc exec -T "$service" sh -c \
              'grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/1/status'
          done
          dc exec -T backend sh -c '! touch /read-only-root-check'
          dc exec -T ai python -c \
            'import json,urllib.request; data=json.load(urllib.request.urlopen("http://127.0.0.1:8001/ready")); assert data["ready"] is True'
