name: kt10

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kt10
      POSTGRES_USER: kt10
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kt10 -d kt10"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      AI_INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:?AI_INTERNAL_SERVICE_TOKEN is required}
      APP_ENV: production
      ODSAY_API_KEY: ${ODSAY_API_KEY:?ODSAY_API_KEY is required}
      # 공공데이터포털의 URL Decoding 키(DECO)를 우선 사용한다. 예전
      # DATA_GO_KR_SERVICE_KEY는 호환용 fallback이며, 키를 프론트엔드나
      # Backend 컨테이너에 전달하지 않는다.
      DATA_GO_KR_SERVICE_KEY: ${DECO:-${DATA_GO_KR_SERVICE_KEY:-}}
      ODSAY_CACHE_DIR: /app/ai/data/cache/odsay
      ODSAY_CACHE_TTL_SECONDS: ${ODSAY_CACHE_TTL_SECONDS:-1800}
      ODSAY_TIMEOUT_SECONDS: ${ODSAY_TIMEOUT_SECONDS:-20}
      ODSAY_LOAD_LANE_ENABLED: ${ODSAY_LOAD_LANE_ENABLED:-true}
      ODSAY_MAX_CANDIDATES: ${ODSAY_MAX_CANDIDATES:-10}
      ODSAY_MAX_CONCURRENT_REQUESTS: ${ODSAY_MAX_CONCURRENT_REQUESTS:-3}
      ODSAY_DAILY_BUDGET: ${ODSAY_DAILY_BUDGET:-1000}
      ELEVATION_CACHE_DIR: /app/ai/data/cache/elevation
      ELEVATION_DEM_DIR: /app/ai/data/cache/elevation/dem
      ELEVATION_REGIONAL_DEM_PATH: /app/ai/data/precomputed/busan_dem_clipped_90m.tif
      ELEVATION_CACHE_TTL_SECONDS: ${ELEVATION_CACHE_TTL_SECONDS:-2592000}
      ROUTE_FEATURE_CACHE_DIR: /app/ai/data/cache/route_features
      ROUTE_FEATURE_CACHE_TTL_SECONDS: ${ROUTE_FEATURE_CACHE_TTL_SECONDS:-1800}
      TMAP_API_KEY: ${TMAP_API_KEY:-}
      TMAP_CACHE_DIR: /app/ai/data/cache/tmap
      TMAP_CACHE_TTL_SECONDS: ${TMAP_CACHE_TTL_SECONDS:-1800}
      TMAP_MAX_CONCURRENT_REQUESTS: ${TMAP_MAX_CONCURRENT_REQUESTS:-3}
      OSMNX_WALK_GEOMETRY_ENABLED: ${OSMNX_WALK_GEOMETRY_ENABLED:-false}
      OSMNX_WALK_GEOMETRY_BLOCKING: ${OSMNX_WALK_GEOMETRY_BLOCKING:-false}
      OSMNX_OVERPASS_URL: ${OSMNX_OVERPASS_URL:-https://lambert.openstreetmap.de/api}
      OSMNX_REQUEST_TIMEOUT_SECONDS: ${OSMNX_REQUEST_TIMEOUT_SECONDS:-12}
      OSMNX_WALK_GEOMETRY_TIMEOUT_SECONDS: ${OSMNX_WALK_GEOMETRY_TIMEOUT_SECONDS:-15}
      RANKER_TIER: ${RANKER_TIER:-bootstrap_baseline}
      PYTHONUTF8: "1"
    volumes:
      # 부산 전체 보행 그래프는 요청 시점에 만든 직선 추정선을 대체하는
      # 분석 입력이다. named volume으로 가리면 이미지/호스트에 준비한
      # busan-walk.graphml이 첫 실행에서 보이지 않아 경사 정보가
      # 미확인으로 남는다. 운영 호스트의 영속 cache 디렉터리를 직접
      # 연결해 정확한 보행 geometry를 즉시 사용한다.
      - ${OSMNX_CACHE_HOST_DIR:-./ai/data/cache/osmnx}:/app/ai/data/cache/osmnx
      - odsay-cache:/app/ai/data/cache/odsay
      - elevation-cache:/app/ai/data/cache/elevation
      - route-feature-cache:/app/ai/data/cache/route_features
      - tmap-cache:/app/ai/data/cache/tmap
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      APP_ENV: production
      MAX_SUPPORTED_TOTAL_WALK_M: ${MAX_SUPPORTED_TOTAL_WALK_M:-15000}
      ROUTE_DEFAULT_TOP_N: ${ROUTE_DEFAULT_TOP_N:-5}
      ROUTE_MODE: ${ROUTE_MODE:-live}
      BUILDING_SOURCE: ${BUILDING_SOURCE:-vworld}
      AI_SERVER_URL: http://ai:8001
      AI_INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:?AI_INTERNAL_SERVICE_TOKEN is required}
      # 임시 LLM 공급자. 프론트엔드에는 키를 절대 전달하지 않는다.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NIM_BASE_URL: ${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NIM_MODEL: ${NIM_MODEL:-}
      NIM_REQUEST_TIMEOUT_SECONDS: ${NIM_REQUEST_TIMEOUT_SECONDS:-30}
      NIM_MAX_OUTPUT_TOKENS: ${NIM_MAX_OUTPUT_TOKENS:-800}
      NIM_RESPONSE_ATTEMPTS: ${NIM_RESPONSE_ATTEMPTS:-2}
      NIM_ROUTE_EXPLANATION_MAX_ROUTES: ${NIM_ROUTE_EXPLANATION_MAX_ROUTES:-3}
      ODSAY_API_KEY: ${ODSAY_API_KEY:?ODSAY_API_KEY is required}
      VWORLD_API_KEY: ${VWORLD_API_KEY:?VWORLD_API_KEY is required}
      VWORLD_API_DOMAIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      VWORLD_CACHE_DIR: /var/cache/kt10/vworld
      VWORLD_CACHE_TTL_HOURS: ${VWORLD_CACHE_TTL_HOURS:-168}
      SHADE_CACHE_DIR: /var/cache/kt10/shade
      SHADE_CACHE_TTL_SECONDS: ${SHADE_CACHE_TTL_SECONDS:-86400}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?KAKAO_REST_API_KEY is required}
      KAKAO_OAUTH_CLIENT_SECRET: ${KAKAO_OAUTH_CLIENT_SECRET:?KAKAO_OAUTH_CLIENT_SECRET is required}
      # 탈퇴 시 카카오 연결 끊기용. 없으면 연결 끊기만 생략하고 탈퇴는 진행한다.
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
      WITHDRAWAL_RETENTION_DAYS: ${WITHDRAWAL_RETENTION_DAYS:-30}
      KAKAO_OAUTH_REDIRECT_URI: ${PUBLIC_ORIGIN}/api/auth/kakao/callback
      FRONTEND_URL: ${PUBLIC_ORIGIN}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:?OPENWEATHER_API_KEY is required}
      BUS_SERVICE_KEY: ${BUS_SERVICE_KEY:?BUS_SERVICE_KEY is required}
      DATABASE_URL: postgresql+psycopg://kt10:${POSTGRES_PASSWORD}@postgres:5432/kt10
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      TRAINING_ANONYMIZATION_SALT: ${TRAINING_ANONYMIZATION_SALT:?TRAINING_ANONYMIZATION_SALT is required}
      LABELING_API_TOKEN: ${LABELING_API_TOKEN:?LABELING_API_TOKEN is required}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-8}
      WEATHER_CACHE_TTL_SECONDS: ${WEATHER_CACHE_TTL_SECONDS:-300}
      SHADE_WEATHER_OBSERVATION_VALIDITY_SECONDS: ${SHADE_WEATHER_OBSERVATION_VALIDITY_SECONDS:-3600}
      PERSONALIZATION_LEARNING_RATE: "0.25"
      PERSONALIZATION_REGULARIZATION: "0.02"
      PERSONALIZATION_MAX_SHARE: "0.35"
      PERSONALIZATION_PRIOR_REVIEWS: "5"
      PERSONALIZATION_USABLE_WEIGHT: "0.45"
      PERSONALIZATION_RATING_WEIGHT: "0.35"
      PERSONALIZATION_REUSE_WEIGHT: "0.20"
      PYTHONUTF8: "1"
    volumes:
      - vworld-cache:/var/cache/kt10/vworld
      - shade-cache:/var/cache/kt10/shade
    command:
      - uvicorn
      - backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    depends_on:
      ai:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        KAKAO_BROWSER_APP_ID: ${VITE_KAKAO_MAP_KEY:?VITE_KAKAO_MAP_KEY is required}
        VITE_DATA_SOURCE: live
        VITE_API_BASE: ""
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  postgres-data:
  odsay-cache:
  elevation-cache:
  route-feature-cache:
  tmap-cache:
  vworld-cache:
  shade-cache:
