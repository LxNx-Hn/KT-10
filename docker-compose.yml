services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      # 컨테이너 네트워크에서는 localhost가 아니라 서비스명(ai)으로 접근해야 하므로
      # backend/.env의 AI_SERVER_URL(로컬 개발용 localhost 값)을 덮어쓴다.
      - AI_SERVER_URL=http://ai:8001
    depends_on:
      - ai
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ai/.env
    volumes:
      - ./ai:/app/ai
      - ./data:/app/data
    command: uvicorn main:app --app-dir ai --host 0.0.0.0 --port 8001 --reload

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
