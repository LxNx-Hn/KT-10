services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kt10
      POSTGRES_USER: kt10
      POSTGRES_PASSWORD: kt10-local-only
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kt10 -d kt10"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8002:8000"
    env_file:
      - backend/.env
    environment:
      # 컨테이너 네트워크에서는 localhost가 아니라 서비스명(ai)으로 접근해야 하므로
      # backend/.env의 AI_SERVER_URL(로컬 개발용 localhost 값)을 덮어쓴다.
      - AI_SERVER_URL=http://ai:8001
      - AI_INTERNAL_SERVICE_TOKEN=${AI_INTERNAL_SERVICE_TOKEN:-}
      # --env-file로 선택한 단일 환경파일이 backend/.env보다 우선한다.
      # 공급자 비밀은 필요한 서버 컨테이너에만 명시적으로 전달한다.
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NIM_BASE_URL=${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NIM_MODEL=${NIM_MODEL:-}
      - NIM_REQUEST_TIMEOUT_SECONDS=${NIM_REQUEST_TIMEOUT_SECONDS:-30}
      - NIM_MAX_OUTPUT_TOKENS=${NIM_MAX_OUTPUT_TOKENS:-800}
      - NIM_RESPONSE_ATTEMPTS=${NIM_RESPONSE_ATTEMPTS:-2}
      - NIM_ROUTE_EXPLANATION_MAX_ROUTES=${NIM_ROUTE_EXPLANATION_MAX_ROUTES:-3}
      # 평소 개발 실행은 demo 기본값을 유지하되, --env-file로 운영 설정을
      # 지정한 검증에서는 운영과 같은 live 공급자 구성을 사용한다.
      - ROUTE_MODE=${ROUTE_MODE:-demo}
      - BUILDING_SOURCE=${BUILDING_SOURCE:-demo}
      - DATA_GO_KR_SERVICE_KEY=${DECO:-${DATA_GO_KR_SERVICE_KEY:-}}
      - VWORLD_API_KEY=${VWORLD_API_KEY:-}
      - VWORLD_API_DOMAIN=${PUBLIC_ORIGIN:-http://localhost:5173}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY:-}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
      - BUS_SERVICE_KEY=${BUS_SERVICE_KEY:-}
      - DATABASE_URL=postgresql+psycopg://kt10:kt10-local-only@postgres:5432/kt10
      - MAX_SUPPORTED_TOTAL_WALK_M=15000
      - ROUTE_DEFAULT_TOP_N=5
      - WEATHER_CACHE_TTL_SECONDS=300
      - SHADE_WEATHER_OBSERVATION_VALIDITY_SECONDS=3600
      - VWORLD_CACHE_DIR=/var/cache/kt10/vworld
      - VWORLD_CACHE_TTL_HOURS=168
      - SHADE_CACHE_DIR=/var/cache/kt10/shade
      - SHADE_CACHE_TTL_SECONDS=86400
    depends_on:
      ai:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - vworld-cache:/var/cache/kt10/vworld
      - shade-cache:/var/cache/kt10/shade
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    ports:
      # 내부 전용 API이므로 개발 환경에서도 localhost에만 bind한다.
      - "127.0.0.1:8001:8001"
    env_file:
      - ai/.env
    environment:
      - AI_INTERNAL_SERVICE_TOKEN=${AI_INTERNAL_SERVICE_TOKEN:-}
      # .env.production을 --env-file로 사용한 로컬 검증에서도 운영과 같은
      # Decoding 키 선택 규칙을 적용한다.
      - DATA_GO_KR_SERVICE_KEY=${DECO:-${DATA_GO_KR_SERVICE_KEY:-}}
      - ODSAY_API_KEY=${ODSAY_API_KEY:-}
      - TRANSIT_PROVIDER_ORDER=${TRANSIT_PROVIDER_ORDER:-tmap}
      - ELEVATION_CACHE_DIR=/app/ai/data/cache/elevation
      - ELEVATION_DEM_DIR=/app/ai/data/cache/elevation/dem
      - ELEVATION_REGIONAL_DEM_PATH=/app/ai/data/precomputed/busan_dem_clipped_90m.tif
      - ODSAY_CACHE_DIR=/app/ai/data/cache/odsay
      - ODSAY_CACHE_TTL_SECONDS=1800
      - ODSAY_MAX_CANDIDATES=10
      - ODSAY_MAX_CONCURRENT_REQUESTS=3
      - ODSAY_DAILY_BUDGET=29
      - ROUTE_FEATURE_CACHE_DIR=/app/ai/data/cache/route_features
      - ROUTE_FEATURE_CACHE_TTL_SECONDS=1800
      - TMAP_CACHE_DIR=/app/ai/data/cache/tmap
      - TMAP_PRECOMPUTED_CACHE_DIR=/app/ai/data/precomputed/tmap
      - TMAP_API_KEY=${TMAP_API_KEY:-}
      - TMAP_CACHE_TTL_SECONDS=1800
      - TMAP_MAX_CONCURRENT_REQUESTS=3
      - TMAP_TRANSIT_CACHE_DIR=/app/ai/data/cache/tmap-transit
      - TMAP_TRANSIT_CACHE_TTL_SECONDS=1800
      - TMAP_TRANSIT_TIMEOUT_SECONDS=12
      - TMAP_TRANSIT_MAX_CANDIDATES=10
      - TMAP_TRANSIT_MAX_CONCURRENT_REQUESTS=3
      - BUS_SERVICE_KEY=${BUS_SERVICE_KEY:-}
      - BIMS_CACHE_TTL_SECONDS=1800
      - BIMS_TIMEOUT_SECONDS=12
      - BIMS_MAX_CONCURRENT_REQUESTS=2
      - BIMS_MAX_CANDIDATES=10
      - BIMS_WALK_SPEED_M_PER_MIN=80
      - ORS_API_KEY=${ORS_API_KEY:-}
      - ORS_BASE_URL=${ORS_BASE_URL:-https://api.openrouteservice.org}
      - ORS_CACHE_DIR=/app/ai/data/cache/ors
      - ORS_TIMEOUT_SECONDS=20
      - ORS_MAX_CONCURRENT_REQUESTS=3
    volumes:
      - ./ai:/app/ai
      - ./data:/app/data
      - elevation-cache:/app/ai/data/cache/elevation
      - odsay-cache:/app/ai/data/cache/odsay
      - route-feature-cache:/app/ai/data/cache/route_features
      - tmap-cache:/app/ai/data/cache/tmap
      - tmap-transit-cache:/app/ai/data/cache/tmap-transit
      - ors-cache:/app/ai/data/cache/ors
    command: uvicorn main:app --app-dir ai --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - frontend/.env
    environment:
      # Vite 개발 프록시는 프런트 컨테이너 내부의 localhost가 아니라
      # Compose backend 서비스로 전달해야 한다.
      - VITE_DEV_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      - ./data:/app/data:ro
      - /app/frontend/node_modules
    command: npm run dev -- --host
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  elevation-cache:
  odsay-cache:
  route-feature-cache:
  tmap-cache:
  tmap-transit-cache:
  ors-cache:
  vworld-cache:
  shade-cache:
