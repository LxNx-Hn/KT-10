services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kt10
      POSTGRES_USER: kt10
      POSTGRES_PASSWORD: kt10-local-only
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kt10 -d kt10"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8002:8000"
    env_file:
      - backend/.env
    environment:
      # 컨테이너 네트워크에서는 localhost가 아니라 서비스명(ai)으로 접근해야 하므로
      # backend/.env의 AI_SERVER_URL(로컬 개발용 localhost 값)을 덮어쓴다.
      - AI_SERVER_URL=http://ai:8001
      - DATABASE_URL=postgresql+psycopg://kt10:kt10-local-only@postgres:5432/kt10
    depends_on:
      ai:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ai/.env
    environment:
      - ELEVATION_CACHE_DIR=/app/ai/data/cache/elevation
      - ELEVATION_DEM_DIR=/app/ai/data/cache/elevation/dem
    volumes:
      - ./ai:/app/ai
      - ./data:/app/data
      - elevation-cache:/app/ai/data/cache/elevation
    command: uvicorn main:app --app-dir ai --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - frontend/.env
    volumes:
      - ./frontend:/app/frontend
      - ./data:/app/data:ro
      - /app/frontend/node_modules
    command: npm run dev -- --host
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  elevation-cache:
