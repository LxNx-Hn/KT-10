<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ODsay 쉼터 경로 프로토타입</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .journey-step.bus .step-badge{background:#20a464}
    #map *{box-sizing:content-box}
    #map .shelter-info{box-sizing:border-box;width:max-content;max-width:min(340px,calc(100vw - 80px));white-space:normal;overflow-wrap:anywhere;word-break:break-word}
    .route-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px;padding:4px;border-radius:10px;background:#e9eef6}
    .route-tabs[hidden]{display:none}
    .route-tab{padding:8px 4px;border:0;border-radius:7px;background:transparent;color:#5c687b;font-size:12px;font-weight:700;white-space:nowrap}
    .route-tab[aria-selected="true"]{background:#fff;color:#2468df;box-shadow:0 1px 5px #17203320}
    .route-tab:disabled{color:#a6afbd;cursor:not-allowed}
    .route-tab-count{font-size:10px;font-weight:600}
    .filters{flex-wrap:wrap}
    #heat-toggle{accent-color:#f26b38}
    #cold-toggle{accent-color:#2d8ee8}
    #smart-bus-toggle{accent-color:#7c4dff}
    #wheelchair-toggle{accent-color:#00a58e}
    #aed-toggle{accent-color:#e33d4f}
    .aed-list{max-height:190px;overflow:auto;margin:7px 0 0;padding-left:22px}
    .aed-list li{margin-bottom:7px}
  </style>
</head>
<body>
  <aside>
    <h1>이동편의시설 경로 탐색</h1>
    <p class="hint">장소나 주소를 검색해 선택하면 내부적으로 좌표를 변환하여 ODsay 경로를 검색합니다.</p>
    <form id="route-form">
      <section class="place-search">
        <label for="origin-search">출발지</label>
        <div class="search-row"><input id="origin-search" autocomplete="off" placeholder="예: 서면역, 부산진구청"><button type="button" data-search="origin">검색</button></div>
        <div id="origin-selected" class="selected-place">선택된 출발지가 없습니다.</div>
        <div id="origin-results" class="search-results"></div>
      </section>
      <section class="place-search">
        <label for="destination-search">목적지</label>
        <div class="search-row"><input id="destination-search" autocomplete="off" placeholder="예: 덕천역, 북구청"><button type="button" data-search="destination">검색</button></div>
        <div id="destination-selected" class="selected-place">선택된 목적지가 없습니다.</div>
        <div id="destination-results" class="search-results"></div>
      </section>
      <button id="route-submit" type="submit" disabled>선택한 장소로 경로 검색</button>
    </form>
    <div class="filters"><label><input id="heat-toggle" type="checkbox" checked> 무더위쉼터</label><label><input id="cold-toggle" type="checkbox" checked> 한파쉼터</label><label><input id="smart-bus-toggle" type="checkbox" checked> 스마트 버스쉘터</label><label><input id="wheelchair-toggle" type="checkbox" checked> 전동휠체어 충전기</label><label><input id="aed-toggle" type="checkbox" checked> AED</label></div>
    <p id="status">초기화 중…</p>
    <nav id="route-tabs" class="route-tabs" aria-label="교통수단별 경로" hidden>
      <button type="button" class="route-tab" data-route-kind="all" aria-selected="false">전체 <span class="route-tab-count">0</span></button>
      <button type="button" class="route-tab" data-route-kind="bus" aria-selected="false">버스 <span class="route-tab-count">0</span></button>
      <button type="button" class="route-tab" data-route-kind="subway" aria-selected="false">지하철 <span class="route-tab-count">0</span></button>
      <button type="button" class="route-tab" data-route-kind="mixed" aria-selected="false">버스+지하철 <span class="route-tab-count">0</span></button>
    </nav>
    <div id="routes"></div>
  </aside>
  <main><div id="map"></div><div class="legend"><span class="subway"></span>지하철 <span class="bus"></span>버스 <span class="walk"></span>ODsay 도보 경로</div></main>
  <script type="module" src="/app.js"></script>
</body>
</html>
